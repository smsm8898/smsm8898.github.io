<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="980" height="450" fill="#ffffff"/>

  <!-- catalog -->
  <rect x="58" y="30" width="862" height="38" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="489" y="54" font-size="13" fill="#111827" text-anchor="middle">전체 카탈로그 — 아이템 수백만 ~ 수십억</text>

  <!-- fan out -->
  <path d="M489 68 V 88" stroke="#9ca3af" fill="none"/>
  <path d="M139 88 H 839" stroke="#9ca3af" fill="none"/>
  <path d="M139 88 V 102" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>
  <path d="M314 88 V 102" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>
  <path d="M489 88 V 102" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>
  <path d="M664 88 V 102" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>
  <path d="M839 88 V 102" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>

  <!-- channels -->
  <g>
    <rect x="58" y="106" width="162" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="58" y="106" width="162" height="4" rx="2" fill="#6b7280"/>
    <text x="70" y="132" font-size="13" font-weight="600" fill="#111827">인기 · 신상</text>
    <text x="70" y="154" font-size="11" fill="#6b7280">질의가 없다</text>
    <text x="70" y="172" font-size="11" fill="#9ca3af">누구에게나 같은 목록</text>
    <text x="70" y="200" font-size="11" fill="#6b7280">≈ 수백 건</text>
  </g>
  <g>
    <rect x="233" y="106" width="162" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="233" y="106" width="162" height="4" rx="2" fill="#2563eb"/>
    <text x="245" y="132" font-size="13" font-weight="600" fill="#111827">i2i 트리거</text>
    <text x="245" y="154" font-size="11" fill="#6b7280">질의 = 최근 본 아이템</text>
    <text x="245" y="172" font-size="11" fill="#9ca3af">사전 계산 테이블 조회</text>
    <text x="245" y="200" font-size="11" fill="#6b7280">≈ 수백 건</text>
  </g>
  <g>
    <rect x="408" y="106" width="162" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="408" y="106" width="162" height="4" rx="2" fill="#7c3aed"/>
    <text x="420" y="132" font-size="13" font-weight="600" fill="#111827">u2i (two-tower)</text>
    <text x="420" y="154" font-size="11" fill="#6b7280">질의 = 유저 벡터 1개</text>
    <text x="420" y="172" font-size="11" fill="#9ca3af">벡터 색인에 ANN 질의</text>
    <text x="420" y="200" font-size="11" fill="#6b7280">≈ 수백 건</text>
  </g>
  <g>
    <rect x="583" y="106" width="162" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="583" y="106" width="162" height="4" rx="2" fill="#059669"/>
    <text x="595" y="132" font-size="13" font-weight="600" fill="#111827">다중 관심사</text>
    <text x="595" y="154" font-size="11" fill="#6b7280">질의 = 유저 벡터 K개</text>
    <text x="595" y="172" font-size="11" fill="#9ca3af">관심사마다 따로 질의</text>
    <text x="595" y="200" font-size="11" fill="#6b7280">≈ 수백 건</text>
  </g>
  <g>
    <rect x="758" y="106" width="162" height="108" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="758" y="106" width="162" height="4" rx="2" fill="#d97706"/>
    <text x="770" y="132" font-size="13" font-weight="600" fill="#111827">그래프 · 규칙</text>
    <text x="770" y="154" font-size="11" fill="#6b7280">질의 = 이웃의 이웃</text>
    <text x="770" y="172" font-size="11" fill="#9ca3af">팔로잉 · 지역 · 재구매</text>
    <text x="770" y="200" font-size="11" fill="#6b7280">≈ 수백 건</text>
  </g>

  <!-- converge -->
  <path d="M139 214 V 236" stroke="#9ca3af" fill="none"/>
  <path d="M314 214 V 236" stroke="#9ca3af" fill="none"/>
  <path d="M489 214 V 236" stroke="#9ca3af" fill="none"/>
  <path d="M664 214 V 236" stroke="#9ca3af" fill="none"/>
  <path d="M839 214 V 236" stroke="#9ca3af" fill="none"/>
  <path d="M139 236 H 839" stroke="#9ca3af" fill="none"/>
  <path d="M489 236 V 248" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>

  <!-- merge -->
  <rect x="264" y="252" width="450" height="46" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="489" y="272" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">합치기 — 중복 제거 · 채널별 쿼터 · 필터</text>
  <text x="489" y="290" font-size="11" fill="#dc2626" text-anchor="middle">채널마다 점수 스케일이 달라 하나로 정렬할 수 없다</text>

  <path d="M489 298 V 326" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>

  <!-- candidates -->
  <rect x="340" y="330" width="298" height="40" rx="6" fill="#ffffff" stroke="#111827"/>
  <text x="489" y="355" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">후보 — 수천 건</text>

  <path d="M489 370 V 396" stroke="#9ca3af" fill="none" marker-end="url(#ah)"/>
  <text x="489" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Ranking — 순서는 여기서 정해진다</text>

  <text x="489" y="438" font-size="12" fill="#9ca3af" text-anchor="middle">검색은 색인 하나에서 긁는다. 추천은 성격이 다른 채널을 병렬로 긁어 합친다.</text>
</svg>
