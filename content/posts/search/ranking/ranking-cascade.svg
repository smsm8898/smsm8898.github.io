<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#111827">Ranking 안의 깔때기 — 건수가 줄수록 문서당 비용이 오른다</text>

  <!-- ===================== column headers ===================== -->
  <text x="40" y="74" font-size="11.5" font-weight="bold" fill="#9ca3af">누가 가중치를 정하나</text>
  <text x="300" y="74" font-size="11.5" font-weight="bold" fill="#9ca3af">무엇을 보나</text>
  <text x="640" y="74" font-size="11.5" font-weight="bold" fill="#9ca3af">후보 수</text>
  <text x="940" y="74" text-anchor="end" font-size="11.5" font-weight="bold" fill="#9ca3af">문서당 비용</text>

  <!-- ===================== stage 1 ===================== -->
  <rect x="40" y="86" width="240" height="58" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="58" y="109" font-size="13.5" font-weight="bold" fill="#1d4ed8">① 규칙 기반 — 사람</text>
  <text x="58" y="129" font-size="11.5" fill="#2563eb">function_score · boost</text>
  <text x="300" y="112" font-size="12.5" fill="#374151">BM25 + 판매량 + 평점 + 최신성을</text>
  <text x="300" y="130" font-size="12.5" fill="#374151">사람이 정한 가중치로 더한다</text>
  <rect x="640" y="102" width="230" height="26" rx="3" fill="#93c5fd"/>
  <text x="650" y="120" font-size="13" font-weight="bold" fill="#ffffff">1,000</text>
  <rect x="900" y="107" width="10" height="16" rx="2" fill="#93c5fd"/>

  <line x1="490" y1="148" x2="490" y2="168" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="163" font-size="11" fill="#2563eb">상위 200건만 통과</text>

  <!-- ===================== stage 2 ===================== -->
  <rect x="40" y="172" width="240" height="58" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="195" font-size="13.5" font-weight="bold" fill="#1d4ed8">② LTR — 데이터</text>
  <text x="58" y="215" font-size="11.5" fill="#2563eb">LambdaMART · rescore</text>
  <text x="300" y="198" font-size="12.5" fill="#374151">수십 개 피처를 학습된 트리 모델이</text>
  <text x="300" y="216" font-size="12.5" fill="#374151">결합한다 — 가중치는 클릭 로그가 정함</text>
  <rect x="640" y="188" width="120" height="26" rx="3" fill="#2563eb"/>
  <text x="650" y="206" font-size="13" font-weight="bold" fill="#ffffff">200</text>
  <rect x="870" y="193" width="40" height="16" rx="2" fill="#2563eb"/>

  <line x1="490" y1="234" x2="490" y2="254" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="249" font-size="11" fill="#2563eb">상위 50건만 통과</text>

  <!-- ===================== stage 3 ===================== -->
  <rect x="40" y="258" width="240" height="58" rx="6" fill="#1d4ed8"/>
  <text x="58" y="281" font-size="13.5" font-weight="bold" fill="#ffffff">③ Cross-encoder — 모델</text>
  <text x="58" y="301" font-size="11.5" fill="#bfdbfe">질의와 문서를 함께 인코딩</text>
  <text x="300" y="284" font-size="12.5" fill="#374151">단어 사이의 상호작용까지 본다</text>
  <text x="300" y="302" font-size="12.5" fill="#374151">미리 계산해 둘 수 없다 — 매번 추론</text>
  <rect x="640" y="274" width="46" height="26" rx="3" fill="#1e3a8a"/>
  <text x="650" y="292" font-size="13" font-weight="bold" fill="#ffffff">50</text>
  <rect x="820" y="279" width="90" height="16" rx="2" fill="#1e3a8a"/>

  <line x1="490" y1="320" x2="490" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== output ===================== -->
  <rect x="40" y="344" width="870" height="48" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="58" y="365" font-size="13.5" font-weight="bold" fill="#374151">점수 순으로 정렬된 상위 50건 → Re-ranking</text>
  <text x="58" y="383" font-size="11.5" fill="#6b7280">여기까지가 "얼마나 관련 있나"의 문제. 다음 단계는 "이 목록이 좋은 목록인가"의 문제다</text>

  <!-- ===================== footnotes ===================== -->
  <text x="40" y="424" font-size="12" fill="#6b7280">* 세 방식은 대안이 아니라 직렬로 쌓인다. Elasticsearch가 LTR을 rescorer로 규정한 것이 이 구조를 그대로 말해 준다</text>
  <text x="40" y="444" font-size="12" fill="#6b7280">* overview의 깔때기가 Ranking 안에서 한 번 더 반복된다 — 규모가 줄어드는 곳마다 같은 원리가 재적용된다. 건수는 서비스마다 다르다</text>
</svg>
