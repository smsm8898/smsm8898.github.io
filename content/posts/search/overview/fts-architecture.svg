<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="dotBlue" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.5" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="530" fill="#ffffff"/>

  <!-- ===================== ① 색인 경로 ===================== -->
  <text x="40" y="66" font-size="14" font-weight="bold" fill="#6b7280">① 색인 경로 — 오프라인 (문서가 바뀔 때만)</text>

  <rect x="40" y="80" width="150" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">문서</text>
  <text x="115" y="122" text-anchor="middle" font-size="11.5" fill="#6b7280">제목 · 본문 · 속성</text>

  <line x1="192" y1="108" x2="236" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="240" y="80" width="190" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="335" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">analyzer</text>
  <text x="335" y="122" text-anchor="middle" font-size="11" fill="#6b7280">char filter → tokenizer → token filter</text>

  <line x1="432" y1="108" x2="466" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="470" y="80" width="170" height="56" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="555" y="97" text-anchor="middle" font-size="11" fill="#6b7280">색인될 term</text>
  <rect x="484" y="104" width="54" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="511" y="121" text-anchor="middle" font-size="12.5" fill="#374151">서울</text>
  <rect x="548" y="104" width="54" height="24" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="575" y="121" text-anchor="middle" font-size="12.5" fill="#374151">맛집</text>

  <line x1="642" y1="108" x2="686" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- ===================== 역색인 (meeting point) ===================== -->
  <rect x="690" y="80" width="250" height="230" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="815" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">역색인 (inverted index)</text>

  <g font-size="13" fill="#78350f">
    <text x="716" y="140">서울</text><text x="800" y="140">→</text><text x="840" y="140">1, 2</text>
    <text x="716" y="166">맛집</text><text x="800" y="166">→</text><text x="840" y="166">1, 3</text>
    <text x="716" y="192">부산</text><text x="800" y="192">→</text><text x="840" y="192">3</text>
  </g>
  <line x1="712" y1="212" x2="918" y2="212" stroke="#fcd34d" stroke-width="1"/>
  <text x="716" y="236" font-size="12" fill="#a16207">+ doc values — 정렬 · 집계용</text>
  <text x="716" y="260" font-size="12" fill="#a16207">+ vector index — 시맨틱 검색용</text>
  <text x="716" y="290" font-size="11" fill="#d97706">같은 문서를 세 가지 방식으로 저장해 둔다</text>

  <!-- ===================== analyzer 대칭 강조 ===================== -->
  <line x1="335" y1="140" x2="335" y2="236" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#dotBlue)" marker-end="url(#dotBlue)"/>
  <text x="350" y="182" font-size="12" font-weight="bold" fill="#2563eb">같은 analyzer여야 한다</text>
  <text x="350" y="200" font-size="11" fill="#2563eb">색인은 &quot;맛집&quot;, 질의는 &quot;맛있는집&quot;으로</text>
  <text x="350" y="216" font-size="11" fill="#2563eb">자르면 영원히 만나지 못한다</text>

  <!-- ===================== ② 질의 경로 ===================== -->
  <text x="40" y="228" font-size="14" font-weight="bold" fill="#1d4ed8">② 질의 경로 — 온라인 (매 검색마다)</text>

  <rect x="40" y="240" width="150" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">사용자 질의</text>
  <text x="115" y="282" text-anchor="middle" font-size="11.5" fill="#1d4ed8">&quot;서울 맛집&quot;</text>

  <line x1="192" y1="268" x2="236" y2="268" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="240" width="190" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">analyzer</text>
  <text x="335" y="282" text-anchor="middle" font-size="11" fill="#1d4ed8">char filter → tokenizer → token filter</text>

  <line x1="432" y1="268" x2="466" y2="268" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="470" y="240" width="170" height="56" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="555" y="257" text-anchor="middle" font-size="11" fill="#2563eb">질의 term</text>
  <rect x="484" y="264" width="54" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="511" y="281" text-anchor="middle" font-size="12.5" fill="#1d4ed8">서울</text>
  <rect x="548" y="264" width="54" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="575" y="281" text-anchor="middle" font-size="12.5" fill="#1d4ed8">맛집</text>

  <line x1="642" y1="268" x2="686" y2="268" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===================== ③ 조회 → 결과 ===================== -->
  <path d="M 815 312 L 815 350 L 115 350 L 115 392" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="330" width="270" height="20" fill="#ffffff"/>
  <text x="515" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">③ posting list 조회 — 여기서 후보가 나온다</text>

  <rect x="40" y="396" width="150" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">후보 문서</text>
  <text x="115" y="438" text-anchor="middle" font-size="11.5" fill="#6b7280">term이 겹치는 것들</text>

  <line x1="192" y1="424" x2="236" y2="424" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="240" y="396" width="190" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="335" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">scoring — BM25</text>
  <text x="335" y="438" text-anchor="middle" font-size="11" fill="#6b7280">term 빈도 · 희귀도 · 문서 길이</text>

  <line x1="432" y1="424" x2="466" y2="424" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="470" y="396" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="555" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">정렬 → 상위 N</text>
  <text x="555" y="438" text-anchor="middle" font-size="11.5" fill="#6b7280">점수 내림차순</text>

  <line x1="642" y1="424" x2="686" y2="424" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="690" y="396" width="250" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="815" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">검색 결과</text>
  <text x="815" y="438" text-anchor="middle" font-size="11.5" fill="#1d4ed8">문서 1, 문서 3, …</text>

  <!-- ===================== footnotes ===================== -->
  <text x="40" y="486" font-size="12" fill="#6b7280">* 두 경로가 같은 analyzer를 공유한다는 것이 전문 검색(FTS)의 핵심 구조다. 그래서 analyzer를 바꾸면 이미 색인된 문서에는 소급되지 않아 재색인이 필요하다</text>
  <text x="40" y="506" font-size="12" fill="#6b7280">* 색인 경로는 문서가 바뀔 때만 돌고, 질의 경로는 매 검색마다 돈다 — 무거운 일을 왼쪽 위로 몰아둔 것이 검색이 빠른 이유다</text>
</svg>
