<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="500" fill="#ffffff"/>

  <text x="40" y="38" font-size="17" font-weight="bold" fill="#111827">후보를 좁히는 세 가지 방법</text>
  <text x="940" y="38" text-anchor="end" font-size="12" fill="#9ca3af">경쟁 관계가 아니라, 한 질의 안에서 같이 쓰인다</text>

  <!-- ===================== Lane 0 — filter ===================== -->
  <rect x="40" y="66" width="170" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">doc values</text>
  <text x="125" y="110" text-anchor="middle" font-size="11.5" fill="#a16207">brand · price · 재고</text>

  <line x1="212" y1="96" x2="246" y2="96" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="250" y="66" width="330" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="268" y="90" font-size="13.5" font-weight="bold" fill="#92400e">① 집합으로 좁히기 — filter</text>
  <text x="268" y="110" font-size="11.5" fill="#a16207">점수 계산 없음 · 비트셋 · 캐시된다</text>

  <line x1="582" y1="96" x2="616" y2="96" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="620" y="66" width="140" height="60" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">1억 → 200만</text>
  <text x="690" y="110" text-anchor="middle" font-size="11" fill="#a16207">순서 없는 집합</text>

  <!-- constraint band -->
  <line x1="690" y1="128" x2="690" y2="142" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="40" y1="152" x2="940" y2="152" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="250" y="158" width="480" height="18" fill="#ffffff"/>
  <text x="490" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">필터가 통과시킨 200만 건 안에서만, 아래 두 경로가 후보를 찾는다</text>

  <!-- ===================== Lane 1 — lexical top-k ===================== -->
  <rect x="40" y="182" width="170" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">역색인</text>
  <text x="125" y="226" text-anchor="middle" font-size="11.5" fill="#2563eb">운동화 | 러닝화</text>

  <line x1="212" y1="212" x2="246" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="182" width="330" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="268" y="206" font-size="13.5" font-weight="bold" fill="#1d4ed8">② 점수로 좁히기 — top-k (BM25)</text>
  <text x="268" y="226" font-size="11.5" fill="#2563eb">Block-Max WAND — 이길 수 없는 블록은 통째로 건너뛴다</text>

  <line x1="582" y1="212" x2="616" y2="212" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="182" width="140" height="60" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="690" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">상위 1,000</text>
  <text x="690" y="226" text-anchor="middle" font-size="11" fill="#2563eb">점수 순</text>

  <!-- ===================== Lane 2 — vector ANN ===================== -->
  <rect x="40" y="272" width="170" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="125" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">벡터 색인</text>
  <text x="125" y="316" text-anchor="middle" font-size="11.5" fill="#7c3aed">질의 임베딩</text>

  <line x1="212" y1="302" x2="246" y2="302" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <rect x="250" y="272" width="330" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="268" y="296" font-size="13.5" font-weight="bold" fill="#5b21b6">③ 근사로 좁히기 — ANN (HNSW)</text>
  <text x="268" y="316" font-size="11.5" fill="#7c3aed">탐색 폭이 곧 정확도와 속도의 손잡이</text>

  <line x1="582" y1="302" x2="616" y2="302" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <rect x="620" y="272" width="140" height="60" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">근접 1,000</text>
  <text x="690" y="316" text-anchor="middle" font-size="11" fill="#7c3aed">거리 순</text>

  <!-- ===================== merge → 후보 풀 ===================== -->
  <path d="M 762 212 L 790 212" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 762 302 L 776 302 L 776 240 L 790 240" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowViolet)"/>

  <rect x="794" y="182" width="146" height="150" rx="8" fill="#1d4ed8"/>
  <text x="867" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">후보 풀</text>
  <text x="867" y="244" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">~1,800</text>
  <text x="867" y="268" text-anchor="middle" font-size="11" fill="#bfdbfe">중복 제거 후</text>
  <text x="867" y="296" text-anchor="middle" font-size="11" fill="#bfdbfe">두 경로가 놓치는</text>
  <text x="867" y="311" text-anchor="middle" font-size="11" fill="#bfdbfe">것이 서로 다르다</text>

  <line x1="867" y1="334" x2="867" y2="360" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="794" y="362" width="146" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="867" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Ranking</text>
  <text x="867" y="399" text-anchor="middle" font-size="11" fill="#2563eb">여기부터 비싼 모델</text>

  <!-- ===================== footnotes ===================== -->
  <text x="40" y="450" font-size="12" fill="#6b7280">* 재현율은 이 단계에서 결정된다 — 여기서 후보에 못 든 문서는 Ranking이 아무리 좋아도 영원히 나오지 않는다</text>
  <text x="40" y="470" font-size="12" fill="#6b7280">* 10개를 보여주려고 1,800개를 긁는다. 재랭킹을 붙일수록 Retrieval의 k는 최종 노출 수보다 훨씬 커야 한다</text>
</svg>
