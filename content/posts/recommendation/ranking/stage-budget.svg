<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>

  <!-- budget line -->
  <path d="M740 50 V 230" stroke="#dc2626" stroke-dasharray="5 4" fill="none"/>
  <text x="748" y="44" font-size="12" font-weight="600" fill="#dc2626">지연 예산</text>

  <!-- row A -->
  <text x="40" y="88" font-size="13" font-weight="600" fill="#111827">한 단계로</text>
  <text x="40" y="108" font-size="11" fill="#6b7280">무거운 모델이 전부 본다</text>
  <rect x="240" y="76" width="700" height="42" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="256" y="102" font-size="12" fill="#dc2626">후보 3,000건 × 무거운 모델</text>
  <text x="928" y="102" font-size="18" fill="#dc2626" text-anchor="end">✕</text>

  <!-- row B -->
  <text x="40" y="176" font-size="13" font-weight="600" fill="#111827">두 단계로</text>
  <text x="40" y="196" font-size="11" fill="#6b7280">무거운 모델이 보는 건수를 줄인다</text>
  <rect x="240" y="164" width="150" height="42" rx="4" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="315" y="182" font-size="11" fill="#6b7280" text-anchor="middle">사전 랭킹</text>
  <text x="315" y="198" font-size="11" fill="#9ca3af" text-anchor="middle">3,000 × 가벼움</text>
  <rect x="396" y="164" width="300" height="42" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="546" y="182" font-size="11" fill="#2563eb" text-anchor="middle">랭킹</text>
  <text x="546" y="198" font-size="11" fill="#2563eb" text-anchor="middle">300 × 무거움</text>

  <text x="489" y="266" font-size="12" fill="#9ca3af" text-anchor="middle">모델을 가볍게 만든 것이 아니라, 무거운 모델이 보는 건수를 줄여서 예산에 들어간다. (비율은 예시)</text>
</svg>
